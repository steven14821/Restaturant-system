# ============================================================
# Pipeline CI/CD para Sistema de Gestión de Restaurante Inteligente
# Azure DevOps → Azure App Service (Windows + Node.js) → Next.js 14
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pr:
  branches:
    include:
      - main

variables:
  # El App Service Windows corre Node 22 (Kudu: v22.23.2). Al compilar con la
  # misma version, los binarios nativos (@next/swc-win32-x64-msvc) coinciden.
  nodeVersion: '22.x'
  azureServiceConnection: 'azure-connection'       # ← tu Service Connection
  environmentGroupName: 'production'               # ← entorno con aprobación manual
  # OJO: no usar el nombre "webAppName". El Deployment Center del portal crea
  # una variable webAppName con el hostname (con sufijo) y las variables de la
  # UI sobrescriben el YAML, apuntando a un recurso que no existe.
  appServiceName: 'restaurant-system-app'
  # URLs de la Web App usadas por el health check del deploy.
  appServiceUrl: 'https://restaurant-system-app-b5gpfzhfb7bsedby.westus3-01.azurewebsites.net'
  appServiceUrlAlt: 'https://restaurant-system-app-b5gpfzhfb7bsedby.azurewebsites.net'

stages:
  # ============================================================
  # ETAPA 1: BUILD (Integración Continua)
  # ============================================================
  - stage: Build
    displayName: 'Compilar proyecto'
    jobs:
      - job: BuildJob
        displayName: 'Build Next.js'
        pool:
          # El App Service es Windows: node_modules debe traer los binarios
          # win32 (por ejemplo @next/swc-win32-x64-msvc).
          vmImage: 'windows-latest'

        steps:
          - checkout: self
            displayName: 'Descargar código fuente'

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: 'Cache de dependencias npm'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm-cache

          - script: npm ci
            displayName: 'Instalar dependencias (npm ci)'
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm-cache

          - script: npm run lint
            displayName: 'Ejecutar linter (ESLint)'

          - script: npm run build
            displayName: 'Compilar para producción (next build)'
            env:
              # Variables mínimas para que el build no falle.
              # En runtime se inyectan desde Azure App Service.
              DATABASE_URL: 'postgresql://placeholder'
              JWT_SECRET: 'build-placeholder-secret'

          - script: npm prune --omit=dev --no-audit --no-fund
            displayName: 'Eliminar dependencias de desarrollo (npm prune)'
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm-cache

          # El paquete que se sube a Kudu debe contener SOLO lo necesario en
          # runtime: un artefacto con el código fuente completo, .next/cache y
          # las devDependencies hace fallar el deploy en el plan F1 por cuota
          # de disco (1 GB) y tiempo de extracción.
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $stage = Join-Path '$(Build.ArtifactStagingDirectory)' 'app'
              New-Item -ItemType Directory -Force -Path $stage | Out-Null

              # .next sin la carpeta cache (solo sirve para builds)
              robocopy '.next' (Join-Path $stage '.next') /E /XD cache /NFL /NDL /NJH /NJS /NP | Out-Null
              if ($LASTEXITCODE -ge 8) { throw "robocopy .next fallo ($LASTEXITCODE)" }

              robocopy 'node_modules' (Join-Path $stage 'node_modules') /E /NFL /NDL /NJH /NJS /NP | Out-Null
              if ($LASTEXITCODE -ge 8) { throw "robocopy node_modules fallo ($LASTEXITCODE)" }

              if (Test-Path 'public') {
                robocopy 'public' (Join-Path $stage 'public') /E /NFL /NDL /NJH /NJS /NP | Out-Null
                if ($LASTEXITCODE -ge 8) { throw "robocopy public fallo ($LASTEXITCODE)" }
              }

              Copy-Item package.json, package-lock.json, next.config.js, server.js, web.config -Destination $stage

              $mb = (Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
              Write-Host ('Tamano del paquete: {0:N0} MB' -f $mb)
              Get-ChildItem $stage | Select-Object Mode, Length, Name | Format-Table
              exit 0
            displayName: 'Preparar paquete de solo runtime'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar artefacto de build'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/app'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # ============================================================
  # ETAPA 2: DEPLOY a PRODUCTION (con aprobación manual)
  # ============================================================
  - stage: Deploy_Production
    displayName: 'Deploy a Producción'
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Desplegar en App Service'
        environment: $(environmentGroupName)   # ← aprobación manual configurada aquí
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'drop'

                # ZipDeploy en App Service Windows no borra los archivos que no
                # están en el paquete: node_modules/.next viejos se mezclan con
                # los nuevos y la app arranca con binarios obsoletos (500 de
                # iisnode). Antes se borraba wwwroot ANTES del deploy, pero si
                # el deploy fallaba el sitio quedaba completamente caído.
                #
                # Ahora se empaqueta y se sube con --clean true: Kudu borra lo
                # que sobra como parte del mismo despliegue, sin ventana en la
                # que wwwroot esté vacío.
                - task: AzureCLI@2
                  name: deployWebApp
                  displayName: 'Deploy a App Service (Windows, limpio y atómico)'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      cd "$(Pipeline.Workspace)/drop"
                      rm -f /tmp/app.zip
                      zip -qr /tmp/app.zip . -x '*.git*'
                      ls -lh /tmp/app.zip

                      # --clean true elimina en wwwroot lo que no venga en el zip
                      # --restart true reinicia iisnode al terminar
                      az webapp deploy \
                        --resource-group rg-restaurant-system \
                        --name $(appServiceName) \
                        --src-path /tmp/app.zip \
                        --type zip \
                        --clean true \
                        --restart true

                # /menu es una página estática: devuelve 200 aunque PostgreSQL
                # esté caído (así se daba el deploy por bueno con la carta
                # vacía). /api/health consulta la BD de verdad:
                #   200 -> app y base de datos OK
                #   503 -> app arriba pero base de datos caída (o sin configurar)
                - script: |
                    APP_URL="$(appServiceUrl)"
                    APP_URL_ALT="$(appServiceUrlAlt)"

                    if [ -z "$APP_URL" ] && [ -z "$APP_URL_ALT" ]; then
                      echo "##vso[task.logissue type=error]No hay appServiceUrl ni appServiceUrlAlt definidas en el pipeline."
                      exit 1
                    fi

                    # La app acaba de reiniciarse: damos margen generoso.
                    for INTENTO in $(seq 1 15); do
                      for URL in "$APP_URL" "$APP_URL_ALT"; do
                        if [ -z "$URL" ]; then
                          continue
                        fi
                        URL="${URL%/}"
                        CODE=$(curl -s -o /tmp/health.json -m 30 -w "%{http_code}" "$URL/api/health" || true)
                        BODY=$(tr -d '\n' < /tmp/health.json 2>/dev/null | cut -c1-300)
                        echo "Intento $INTENTO -> $URL/api/health : $CODE $BODY"
                        case "$CODE" in
                          200)
                            echo "##vso[task.complete result=Succeeded]Deploy verificado: app y base de datos OK ($URL/api/health => 200)"
                            exit 0
                            ;;
                          503)
                            # La app está bien; el problema es la BD y no se
                            # arregla esperando. Dejamos pasar el pipeline pero
                            # avisamos con el motivo exacto.
                            echo "##vso[task.logissue type=warning]La app responde pero la base de datos no: $BODY"
                            exit 0
                            ;;
                        esac
                      done
                      sleep 15
                    done

                    # No marcamos el pipeline como fallido: el deploy ya se hizo
                    # y la app puede estar aun en warm-up. Revisar a mano.
                    echo "##vso[task.logissue type=warning]La app no responde en /api/health tras ~4 min; revisa los logs de iisnode en D:\\home\\LogFiles\\Application\\iisnode"
                  displayName: 'Verificar health check (app + base de datos)'
                  continueOnError: true
